<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>烩饭 · Huifan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Red+Hat+Mono:wght@400;500&family=Red+Hat+Text:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>烩饭 <span class="latin">Huifan</span></h1>
      <p class="tagline">Your recovery, turned into today's order.</p>
    </header>

    <!-- First-run onboarding (browser-onboarding) mounts here. Empty once
         data is present, except for a small "Your data" manage control. -->
    <section id="onboarding-section" class="card"></section>

    <!-- Recovery score (task 2) mounts here -->
    <section id="score-section" class="card" aria-live="polite">
      <p class="muted">Loading…</p>
    </section>

    <!-- Task input + reorder + check-in (tasks 3–5) mount here -->
    <section id="tasks-section" class="card"></section>

    <!-- Patterns page (task 6) mounts here -->
    <section id="patterns-section" class="card"></section>

    <!-- Insights page (task 7) mounts here -->
    <section id="insights-section" class="card"></section>

    <footer class="app-footer">
      <p class="disclaimer">
        Not medical advice. Huifan doesn't diagnose; clinical decisions stay with professionals.
      </p>
      <p class="privacy muted">Your health data stays on this device. No account, no server.</p>
    </footer>
  </main>

  <!--
    Data loads via <script> tags (not fetch) so the app works when you just
    open index.html as a file:// URL — browsers block fetch() of local JSON.
    Real data (data/daily.js) is loaded first if present and wins over the
    committed synthetic sample. Both are optional; app.js handles absence.
    The onerror attribute keeps a missing file from throwing in the console.
  -->
  <!--
    Bootstrap: hydrate window.HUIFAN_DAILY from the browser store (written by
    onboarding) BEFORE app.js picks a data source. Real committed data
    (data/daily.js) still wins because it loads just after and overwrites.
  -->
  <script>
    (function () {
      try {
        var raw = window.localStorage.getItem("huifan.daily.v1");
        if (raw) {
          var rows = JSON.parse(raw);
          if (Array.isArray(rows) && rows.length > 0) window.HUIFAN_DAILY = rows;
        }
      } catch (e) {
        /* storage off — onboarding still works for the session */
      }
    })();
  </script>
  <script src="data/daily.js" onerror="window.__noReal=true"></script>
  <script src="data/sample-daily.js" onerror="window.__noSample=true"></script>
  <script src="data/patterns.js" onerror="window.__noPatterns=true"></script>
  <script src="data/cdc.js" onerror="window.__noCdc=true"></script>

  <!-- Pure logic modules load first, UI wiring last. -->
  <script src="js/score.js"></script>
  <script src="js/order.js"></script>
  <script src="js/tag.js"></script>
  <script src="js/patterns-core.js"></script>
  <script src="js/patterns.js"></script>
  <script src="js/insights-core.js"></script>
  <script src="js/insights.js"></script>
  <script src="js/onboarding.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
